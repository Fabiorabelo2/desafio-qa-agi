name: Testes de API (RestAssured)

on:
  push:
    paths: ['api-dogapi/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api-dogapi/**']
  workflow_dispatch:

jobs:
  testes-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-dogapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Executar testes
        run: mvn -B test
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-api
          path: |
            api-dogapi/target/surefire-reports/
            api-dogapi/target/allure-results/
          retention-days: 15
